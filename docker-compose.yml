services:
  postgres:
    image: postgres:16-alpine
    container_name: swiftly-postgres
    environment:
      POSTGRES_USER: swiftly
      POSTGRES_PASSWORD: swiftly_dev
      POSTGRES_DB: swiftly
    ports:
      - '5452:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swiftly']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swiftly-redis
    ports:
      - '6409:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
